[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleurdelys"
version = "0.1.0"
description = "A lightweight CMake Language Server for DSL usage"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygls>=2.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller",
]

[project.scripts]
fleurdelys = "fleurdelys.__main__:main"

[tool.hatch.build.targets.wheel.force-include]
"annotations/core.cmake" = "fleurdelys/annotations/core.cmake"
"annotations/cmake.cmake" = "fleurdelys/annotations/cmake.cmake"
